name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 저장소 Settings → Secrets and variables → Actions → Variables 에 값을 넣으면
      # client/env.js 를 그 값으로 덮어써서 배포합니다. (값이 하나도 없으면 커밋된 env.js 그대로 사용)
      - name: Generate env.js from repository variables
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          SERVER_URL: ${{ vars.SERVER_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
          APPLE_REDIRECT_URI: ${{ vars.APPLE_REDIRECT_URI }}
          FILE_TTL_HOURS: ${{ vars.FILE_TTL_HOURS }}
          MAX_UPLOAD_MB: ${{ vars.MAX_UPLOAD_MB }}
        run: |
          node -e '
            const e = process.env;
            const keys = ["APP_NAME","SERVER_URL","GOOGLE_CLIENT_ID","APPLE_CLIENT_ID","APPLE_REDIRECT_URI","FILE_TTL_HOURS","MAX_UPLOAD_MB"];
            if (!keys.some((k) => e[k])) { console.log("No repository variables set; using committed client/env.js"); process.exit(0); }
            const env = {
              APP_NAME: e.APP_NAME || "Chat Site",
              SERVER_URL: e.SERVER_URL || "",
              GOOGLE_CLIENT_ID: e.GOOGLE_CLIENT_ID || "",
              APPLE_CLIENT_ID: e.APPLE_CLIENT_ID || "",
              APPLE_REDIRECT_URI: e.APPLE_REDIRECT_URI || "",
              FILE_TTL_HOURS: Number(e.FILE_TTL_HOURS) || 72,
              MAX_UPLOAD_MB: Number(e.MAX_UPLOAD_MB) || 25,
            };
            require("fs").writeFileSync("client/env.js", "window.CHAT_ENV = " + JSON.stringify(env, null, 2) + ";\n");
            console.log("Generated client/env.js");
          '

      # 배포마다 파일 주소에 버전(?v=커밋)을 붙여, 브라우저가 예전 파일과 새 파일을 섞어 쓰지 않게 함
      # (섞이면 모듈을 불러오지 못해 무한 로딩이 됨)
      - name: Stamp asset versions
        run: |
          V="${GITHUB_SHA::8}"
          find client/js -name '*.js' -exec sed -i -E "s#(from '\.{1,2}/[^'?]+\.js)'#\1?v=${V}'#g" {} +
          sed -i -E "s#(href=\"css/style\.css)\"#\1?v=${V}\"#; s#(src=\"env\.js)\"#\1?v=${V}\"#; s#(src=\"js/app\.js)\"#\1?v=${V}\"#" client/index.html
          echo "stamped v=${V}"; grep -c "?v=${V}" client/index.html; grep -rho "?v=${V}" client/js | wc -l

      # 예전 주소(…/chat_site/client/)로 들어와도 앱으로 이동하도록 리디렉트 페이지 추가
      - name: Add redirect for old /client/ URL
        run: |
          mkdir -p client/client
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../"><script>location.replace("../"+location.search+location.hash)</script><a href="../">Chat Site</a>' > client/client/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client
      - id: deployment
        uses: actions/deploy-pages@v4
