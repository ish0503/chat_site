<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1e1f22">
  <meta name="description" content="폴더로 정리하는 채팅방 · 통화방">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chat Site">
  <meta name="application-name" content="Chat Site">
  <title>Chat Site</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 화면 높이 맞추기 (iPhone 홈 화면 앱 · 모바일): 키보드가 올라오면 보이는 영역만큼만 쓰고, 페이지가 위로 밀려 올라간 채 남지 않게 함.
    // 키보드는 "다 올라온 뒤"에야 높이를 알려 주므로, 지난번 키보드 높이를 기억해 두었다가 입력창을 누르는 순간 미리 맞춰서
    // 화면이 통째로 밀렸다가 되돌아오거나 여러 번 덜컹거리지 않고 키보드와 함께 한 번에 움직이게 함.
    (function () {
      var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
      var vv = window.visualViewport;
      var root = document.documentElement;
      if (!touch) return;
      root.classList.add('touch');
      var base = 0;        // 키보드가 없을 때의 높이
      var applied = 0;     // 지금 화면에 적용한 높이
      var open = false;    // 키보드가 올라와 있는지
      var guessUntil = 0;  // 이 시각까지는 미리 맞춘 값을 유지 (키보드가 움직이는 중)
      var guessOpen = false;
      var raf = 0;
      var lastAngle = null;
      var noGuess = false; // 화면 키보드가 뜨지 않는 기기(외장 키보드)면 미리 맞추지 않음
      function angle() { var o = screen.orientation; return o && typeof o.angle === 'number' ? o.angle : (window.orientation || 0); }
      function key() { return 'cs.kbh.' + (Math.abs(angle()) % 180 ? 'l' : 'p'); }
      function recall() { try { return Number(localStorage.getItem(key())) || 0; } catch (e) { return 0; } }
      function remember(k) { try { localStorage.setItem(key(), String(Math.round(k))); } catch (e) { /* noop */ } }
      function apply(h, isOpen) {
        h = Math.round(h);
        if (h !== applied) { applied = h; root.style.setProperty('--app-h', h + 'px'); }
        if (isOpen !== open) { open = isOpen; root.classList.toggle('kb-open', isOpen); }
      }
      function measure() {
        raf = 0;
        var scale = (vv && vv.scale) || 1;
        // 화면이 확대된 동안에는 보이는 영역의 크기가 키보드와 상관없이 달라지므로 높이를 건드리지 않음
        // (확대 배율을 곱해 높이를 되돌리면 실제로 보이는 것보다 화면이 길어져 입력창이 아래로 사라짐)
        if (scale > 1.02) return;
        var h = vv ? vv.height : window.innerHeight;
        var a = angle();
        if (a !== lastAngle) { lastAngle = a; base = 0; guessUntil = 0; }
        if (!base || h > base) base = h;
        var isOpen = base - h > 120;
        var now = Date.now();
        if (now < guessUntil && isOpen !== guessOpen) {
          // 키보드가 아직 올라오는(내려가는) 중: 미리 맞춘 높이를 그대로 둠
        } else {
          if (guessUntil && now >= guessUntil && guessOpen && !isOpen) noGuess = true;
          guessUntil = 0;
          apply(h, isOpen);
          if (isOpen) remember(base - h);
        }
        if (window.scrollY || root.scrollTop || (document.body && document.body.scrollTop)) window.scrollTo(0, 0);
      }
      function fit() { if (!raf) raf = requestAnimationFrame(measure); }
      function later() { setTimeout(fit, 120); setTimeout(fit, 380); setTimeout(fit, 720); setTimeout(fit, 1300); }
      function typable(el) {
        if (!el || el.readOnly || el.disabled) return false;
        if (el.isContentEditable || el.tagName === 'TEXTAREA') return true;
        return el.tagName === 'INPUT' && /^(text|search|email|url|tel|password|number|)$/i.test(el.getAttribute('type') || '');
      }
      function guess(isOpen, h) { guessOpen = isOpen; guessUntil = Date.now() + 650; apply(h, isOpen); }
      if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', function () { base = 0; guessUntil = 0; setTimeout(fit, 300); });
      document.addEventListener('focusin', function (e) {
        var k = recall();
        if (!open && !noGuess && base && k > 120 && k < base * 0.7 && typable(e.target)) guess(true, base - k);
        later();
      });
      document.addEventListener('focusout', function () {
        // 다른 입력창으로 옮겨 간 것이 아니면 키보드가 내려가는 것 → 바로 원래 높이로
        setTimeout(function () { if (open && base && !typable(document.activeElement)) guess(false, base); }, 40);
        later();
      });
      window.addEventListener('pageshow', fit);
      measure();
    })();
    // 시작 감시: 앱이 10초 안에 뜨지 않거나 파일을 불러오지 못하면, 무한 로딩 대신 원인과 복구 버튼을 보여줍니다.
    (function () {
      var shown = false;
      function show(reason) {
        if (shown || window.__csBooted) return;
        shown = true;
        var box = document.querySelector('.boot');
        if (!box) return;
        box.innerHTML = '<div class="boot-error"><h2>앱을 불러오지 못했습니다</h2>'
          + '<p>업데이트 직후라 브라우저에 예전 파일이 남아 있을 수 있습니다. 아래 버튼을 눌러 주세요.</p>'
          + '<button type="button" id="boot-fix">캐시 비우고 다시 불러오기</button>'
          + '<pre></pre></div>';
        box.querySelector('pre').textContent = reason || '';
        document.getElementById('boot-fix').onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).catch(function () {}).then(function () {
            location.replace(location.pathname + '?reload=' + Date.now() + location.hash);
          });
        };
      }
      window.addEventListener('error', function (e) { if (!window.__csBooted) show(e.message || '스크립트 오류'); });
      window.addEventListener('unhandledrejection', function (e) { if (!window.__csBooted) show(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () { show('시간 초과: 10초 안에 앱이 시작되지 않았습니다.'); }, 10000);
      window.__csBootFail = show;
    })();
  </script>
  <script src="env.js"></script>
  <script type="module" src="js/app.js" onerror="window.__csBootFail && window.__csBootFail('js/app.js 를 불러오지 못했습니다.')"></script>
</head>
<body>
  <div id="app">
    <div class="boot" aria-busy="true" aria-label="불러오는 중">
      <div class="boot-skel">
        <div class="boot-side"><span class="sk sk-name"></span><span class="sk sk-line"></span><span class="sk sk-line"></span><span class="sk sk-line short"></span><span class="sk sk-line"></span></div>
        <div class="boot-main"><span class="sk boot-head"></span><div class="skeleton-msg"><span class="sk sk-avatar"></span><div class="sk-lines"><span class="sk sk-name"></span><span class="sk sk-line"></span></div></div><div class="skeleton-msg"><span class="sk sk-avatar"></span><div class="sk-lines"><span class="sk sk-name"></span><span class="sk sk-line short"></span></div></div><div class="skeleton-msg"><span class="sk sk-avatar"></span><div class="sk-lines"><span class="sk sk-name"></span><span class="sk sk-line"></span></div></div></div>
      </div>
    </div>
  </div>
  <noscript>이 앱을 사용하려면 JavaScript를 켜 주세요.</noscript>
</body>
</html>
