<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1e1f22">
  <meta name="description" content="폴더로 정리하는 채팅방 · 통화방">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chat Site">
  <meta name="application-name" content="Chat Site">
  <title>Chat Site</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 시작 감시: 앱이 10초 안에 뜨지 않거나 파일을 불러오지 못하면, 무한 로딩 대신 원인과 복구 버튼을 보여줍니다.
    (function () {
      var shown = false;
      function show(reason) {
        if (shown || window.__csBooted) return;
        shown = true;
        var box = document.querySelector('.boot');
        if (!box) return;
        box.innerHTML = '<div class="boot-error"><h2>앱을 불러오지 못했습니다</h2>'
          + '<p>업데이트 직후라 브라우저에 예전 파일이 남아 있을 수 있습니다. 아래 버튼을 눌러 주세요.</p>'
          + '<button type="button" id="boot-fix">캐시 비우고 다시 불러오기</button>'
          + '<pre></pre></div>';
        box.querySelector('pre').textContent = reason || '';
        document.getElementById('boot-fix').onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).catch(function () {}).then(function () {
            location.replace(location.pathname + '?reload=' + Date.now() + location.hash);
          });
        };
      }
      window.addEventListener('error', function (e) { if (!window.__csBooted) show(e.message || '스크립트 오류'); });
      window.addEventListener('unhandledrejection', function (e) { if (!window.__csBooted) show(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () { show('시간 초과: 10초 안에 앱이 시작되지 않았습니다.'); }, 10000);
      window.__csBootFail = show;
    })();
  </script>
  <script src="env.js"></script>
  <script type="module" src="js/app.js" onerror="window.__csBootFail && window.__csBootFail('js/app.js 를 불러오지 못했습니다.')"></script>
</head>
<body>
  <div id="app">
    <div class="boot" aria-busy="true" aria-label="불러오는 중">
      <div class="boot-skel">
        <div class="boot-side"><span class="sk sk-name"></span><span class="sk sk-line"></span><span class="sk sk-line"></span><span class="sk sk-line short"></span><span class="sk sk-line"></span></div>
        <div class="boot-main"><span class="sk boot-head"></span><div class="skeleton-msg"><span class="sk sk-avatar"></span><div class="sk-lines"><span class="sk sk-name"></span><span class="sk sk-line"></span></div></div><div class="skeleton-msg"><span class="sk sk-avatar"></span><div class="sk-lines"><span class="sk sk-name"></span><span class="sk sk-line short"></span></div></div><div class="skeleton-msg"><span class="sk sk-avatar"></span><div class="sk-lines"><span class="sk sk-name"></span><span class="sk sk-line"></span></div></div></div>
      </div>
    </div>
  </div>
  <noscript>이 앱을 사용하려면 JavaScript를 켜 주세요.</noscript>
</body>
</html>
